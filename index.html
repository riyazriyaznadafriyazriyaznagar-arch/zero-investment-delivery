<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zero Investment Delivery Franchise</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f5f7fb;color:#172033;line-height:1.6}
header{background:linear-gradient(135deg,#0f172a,#1e40af);color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-size:20px;font-weight:bold}
header a{color:#fff;text-decoration:none;margin-left:16px;font-size:14px}
.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb,#0ea5e9);color:#fff;padding:80px 6%;text-align:center}
.hero h1{font-size:42px;max-width:850px;margin:auto}
.hero p{max-width:700px;margin:18px auto 28px;font-size:18px}
.btn{display:inline-block;background:#facc15;color:#111827;padding:13px 22px;border-radius:8px;text-decoration:none;font-weight:bold;border:none;cursor:pointer}
section{padding:60px 6%}
.section-title{text-align:center;font-size:30px;margin-bottom:35px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;max-width:1100px;margin:auto}
.card{background:#fff;padding:28px;border-radius:14px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
.card h3{margin-bottom:10px;color:#1d4ed8}
.form-box{max-width:650px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
input,select,textarea{width:100%;padding:13px;margin:8px 0 16px;border:1px solid #d1d5db;border-radius:8px;font-size:15px}
textarea{min-height:110px;resize:vertical}
.form-box button{width:100%}
.message{text-align:center;font-weight:bold;margin-top:12px}
.admin{background:#111827;color:#fff}
.admin-box{max-width:1200px;margin:auto;background:#1f2937;padding:30px;border-radius:16px}
.admin-box input{background:#fff}
#adminPanel,#customerPanel{display:none;margin-top:30px}
.dashboard{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:25px}
.stat{background:#fff;color:#111827;padding:20px;border-radius:12px;text-align:center}
.stat strong{display:block;font-size:30px;color:#2563eb}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:15px}
.search-box{flex:1;min-width:220px;margin:0}
.refresh-btn{background:#2563eb;color:#fff;border:none;padding:12px 18px;border-radius:7px;cursor:pointer}
.table-wrap{overflow-x:auto;background:#fff;color:#111827;border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:1100px}
th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}
th{background:#e5e7eb}
.action-btn{display:inline-block;padding:7px 10px;border-radius:6px;text-decoration:none;border:none;cursor:pointer;font-size:12px;margin:2px}
.call-btn{background:#16a34a;color:#fff}
.whatsapp-btn{background:#22c55e;color:#fff}
.delete-btn{background:#dc2626;color:#fff}
.status-select{width:auto;margin:0;padding:7px;font-size:12px}
.customer-section{background:#e0f2fe}
.customer-box{max-width:850px;margin:auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.customer-tabs{display:flex;gap:10px;margin-bottom:20px}
.customer-tabs button{flex:1;padding:12px;border:none;border-radius:8px;cursor:pointer}
.active-tab{background:#2563eb;color:#fff}
.inactive-tab{background:#e5e7eb;color:#111827}
.customer-table{overflow-x:auto}
.customer-table table{min-width:650px}
.logout-btn{background:#dc2626;color:#fff;border:none;padding:10px 16px;border-radius:7px;cursor:pointer}
footer{background:#020617;color:#cbd5e1;text-align:center;padding:25px;font-size:14px}

@media(max-width:768px){
.hero h1{font-size:30px}
.cards{grid-template-columns:1fr}
.dashboard{grid-template-columns:repeat(2,1fr)}
header{padding:15px 4%}
header a{margin-left:7px;font-size:12px}
section{padding:45px 5%}
}
</style>
</head>

<body>

<header>
<div class="logo">Delivery Franchise</div>
<div>
<a href="#benefits">Benefits</a>
<a href="#enquiry">Enquiry</a>
<a href="#customer">Customer</a>
<a href="#admin">Admin</a>
</div>
</header>

<section class="hero">
<h1>Start Your Delivery Business With Zero Investment</h1>
<p>Become a delivery business partner and explore a simple, low-cost business opportunity
